# ~/.codex/config.toml
#
# ============================================================
# 方案 A（推荐）：通过本地 LiteLLM 网关（任意 Codex 版本可用）
#   Codex --(Responses)--> LiteLLM:4000 --(Chat Completions)--> api.cline.bot
# ============================================================
model = "cline-pass/qwen3.7-max"
model_provider = "local-litellm"

[model_providers.local-litellm]
name = "ClinePass via LiteLLM"
base_url = "http://localhost:4000/v1"
wire_api = "responses"
env_key = "LITELLM_KEY"

# ============================================================
# 方案 B：旧版 Codex 直连（仅 2026-02 之前的版本支持 wire_api="chat"）
# 新版会对 wire_api="chat" 直接硬报错。
# 若要用，注释掉上面方案 A 的 3 行，改用下面这段：
# ============================================================
# model = "cline-pass/qwen3.7-max"
# model_provider = "cline-pass"
#
# [model_providers.cline-pass]
# name = "ClinePass"
# base_url = "https://api.cline.bot/api/v1"
# env_key = "CLINE_API_KEY"
# wire_api = "chat"

# 可选：降低推理强度/指定 sandbox 等（按需）
# model_reasoning_effort = "medium"
# approval_policy = "on-request"
