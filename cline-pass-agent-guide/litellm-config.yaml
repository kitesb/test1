# LiteLLM 配置：把 Cline Pass (Chat Completions) 桥接成 Codex 需要的 Responses API
#
# 启动：
#   export CLINE_API_KEY="你的_cline_api_key"
#   litellm --config litellm-config.yaml --port 4000
#
# Codex 里把 base_url 指向 http://localhost:4000/v1，wire_api="responses"。
#
# 关键点：
#   * model 用 openai/<slug> 前缀 —— 让 LiteLLM 走 OpenAI 兼容的 chat/completions
#   * model_info.mode: chat —— 明确告诉 LiteLLM 这是 chat 模型，/v1/responses 时自动桥接
#   * api_key 用 os.environ/CLINE_API_KEY —— 从环境变量读取，别硬编码

model_list:
  - model_name: "cline-pass/qwen3.7-max"
    litellm_params:
      model: "openai/cline-pass/qwen3.7-max"
      api_base: "https://api.cline.bot/api/v1"
      api_key: "os.environ/CLINE_API_KEY"
    model_info:
      mode: chat

  - model_name: "cline-pass/qwen3.8-max"
    litellm_params:
      model: "openai/cline-pass/qwen3.8-max"
      api_base: "https://api.cline.bot/api/v1"
      api_key: "os.environ/CLINE_API_KEY"
    model_info:
      mode: chat

  - model_name: "cline-pass/kimi-k3"
    litellm_params:
      model: "openai/cline-pass/kimi-k3"
      api_base: "https://api.cline.bot/api/v1"
      api_key: "os.environ/CLINE_API_KEY"
    model_info:
      mode: chat

  - model_name: "cline-pass/glm-5.3"
    litellm_params:
      model: "openai/cline-pass/glm-5.3"
      api_base: "https://api.cline.bot/api/v1"
      api_key: "os.environ/CLINE_API_KEY"
    model_info:
      mode: chat

  - model_name: "cline-pass/deepseek-v4-pro"
    litellm_params:
      model: "openai/cline-pass/deepseek-v4-pro"
      api_base: "https://api.cline.bot/api/v1"
      api_key: "os.environ/CLINE_API_KEY"
    model_info:
      mode: chat

general_settings:
  # 本地网关随便设一个即可；Codex 用这个值当 api key
  master_key: "sk-anything-local"
